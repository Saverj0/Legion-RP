<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Legion RP - Server GTA 5 Online PS4</title>

  <script src="https://unpkg.com/react@17/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Inter',sans-serif;
      overflow-x:hidden;
      background:#000;
      color:white;
    }

    .gradient-text{
      background:linear-gradient(90deg,#ef4444 0%,#3b82f6 100%);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .glow-border{
      box-shadow:0 0 15px rgba(239,68,68,0.35);
      transition:0.3s;
    }

    .glow-border:hover{
      box-shadow:0 0 25px rgba(239,68,68,0.6);
      transform:translateY(-2px);
    }

    .card-hover{
      transition:0.3s;
    }

    .card-hover:hover{
      transform:translateY(-6px);
    }

    .logo-spin{
      animation:spin 14s linear infinite;
    }

    @keyframes spin{
      from{transform:rotate(0deg);}
      to{transform:rotate(360deg);}
    }

    .animate-pulse-slow{
      animation:pulse 3s infinite;
    }

    @keyframes pulse{
      0%,100%{opacity:1;}
      50%{opacity:.7;}
    }

    .star-animation{
      animation:starBlink 1.5s infinite alternate;
    }

    @keyframes starBlink{
      from{opacity:1;}
      to{opacity:.5;}
    }

    .bg-overlay{
      position:absolute;
      inset:0;
      background:linear-gradient(to bottom, rgba(0,0,0,.88), rgba(0,0,0,.75));
    }

    .line-clamp-2{
      display:-webkit-box;
      -webkit-line-clamp:2;
      -webkit-box-orient:vertical;
      overflow:hidden;
    }
  </style>
</head>

<body>
<div id="root"></div>

<script type="text/babel">

const HomeIcon = (props) => (
<svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24" {...props}>
<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
<polyline points="9 22 9 12 15 12 15 22"></polyline>
</svg>
);

const UsersIcon = (props) => (
<svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24" {...props}>
<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
<circle cx="9" cy="7" r="4"></circle>
<path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
<path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
</svg>
);

const HandshakeIcon = (props) => (
<svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24" {...props}>
<path d="M11 16h1.5"></path>
</svg>
);

const FileTextIcon = (props) => (
<svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24" {...props}>
<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
</svg>
);

const ArrowRightIcon = (props) => (
<svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24" {...props}>
<line x1="5" y1="12" x2="19" y2="12"></line>
<polyline points="12 5 19 12 12 19"></polyline>
</svg>
);

const StarIcon = (props) => (
<svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24" {...props}>
<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
</svg>
);

const ShieldIcon = (props) => (
<svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24" {...props}>
<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
</svg>
);

const BriefcaseIcon = (props) => (
<svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24" {...props}>
<rect x="2" y="7" width="20" height="14" rx="2"></rect>
</svg>
);

const AwardIcon = (props) => (
<svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24" {...props}>
<circle cx="12" cy="8" r="7"></circle>
</svg>
);

const App = () => {

const [activeSection,setActiveSection] = React.useState("home");
const [isMenuOpen,setIsMenuOpen] = React.useState(false);

const staffMembers = [

{
id:1,
name:"Saverjo_",
role:"Server Direction®",
rank:"Creator",
avatar:"https://images-ext-1.discordapp.net/external/5t2w4t2sSHF-XURtaQem0dMftCz2pWwUwsLHCBlWFaM/%3Fsize%3D4096%26ignore%3Dtrue%29./https/cdn.discordapp.com/avatars/631480067213492238/c09fd6afbad96af72363b0dacdf4d369.png",
bio:"Founder e Developer del server.",
achievements:["Ownership","Developer"]
},

{
id:2,
name:"Sibillo",
role:"Server Direction®",
rank:"CEO",
avatar:"https://images-ext-1.discordapp.net/external/UoLBl_4w9sjWdJuCuILoxHemfqKm5XTLx99Mg9iTXNI/%3Fsize%3D4096%26ignore%3Dtrue%29./https/cdn.discordapp.com/avatars/1261436710835851379/e911ca506c77c18eb8e3579a2373a3c9.png",
bio:"Gestisce le operazioni del server.",
achievements:["Management"]
},

{
id:3,
name:"Angelo",
role:"Server Direction®",
rank:"CEO",
avatar:"https://cdn.discordapp.com/embed/avatars/0.png",
bio:"Membro dello staff Legion RP.",
achievements:["Support"]
},

{
id:4,
name:"kaaeza",
role:"Server Direction®",
rank:"Coordinator",
avatar:"https://images-ext-1.discordapp.net/external/0YjDQ9o9C6rPxzbfCC_qbgoti-kRSCcSoQwzZEcaLU8/%3Fsize%3D4096%26ignore%3Dtrue%29./https/cdn.discordapp.com/avatars/822411819456921650/1a66a3b0559c58711f7337346a38ec6c.png",
bio:"Coordinator del server.",
achievements:["Developer"]
}

];

const partnerships = [
{
id:1,
name:"Prime RP Bot",
logo:"https://images-ext-1.discordapp.net/external/d_2df_jUsletkBbMLaJHbT7C6w43kwjui5WOgGoV8c4/%3Fsize%3D4096%26ignore%3Dtrue%29./https/cdn.discordapp.com/avatars/1308506841801822220/741dfdc823aeb7e2abdc0af66b480275.png",
description:"Bot per il roleplay da Console",
url:"https://discord.gg/68zcbdeGA4",
rating:4.9
}
];

const navItems = [
{id:"home",label:"Home",icon:HomeIcon},
{id:"staff",label:"Staff",icon:UsersIcon},
{id:"partnerships",label:"Partnership",icon:HandshakeIcon},
{id:"legal",label:"Info Legali",icon:FileTextIcon}
];

const StatCard = ({value,label,icon:Icon,color}) => (
<div className="bg-gradient-to-br from-gray-900 to-gray-800 rounded-2xl p-6 border border-gray-700 card-hover">
<div className={`w-12 h-12 rounded-xl ${color} bg-opacity-10 flex items-center justify-center mb-4`}>
<Icon className={`w-6 h-6 ${color}`}/>
</div>

<div className="text-3xl font-bold">{value}</div>
<div className="text-gray-400">{label}</div>
</div>
);

return(
<div className="min-h-screen relative overflow-hidden">

<div
className="absolute inset-0 bg-cover bg-center"
style={{
backgroundImage:"url('https://cdn.discordapp.com/attachments/1501629649942478989/1502620001323061268/image00002.png_3-1.webp?ex=6a005f6d&is=69ff0ded&hm=4673be0df5cb9be9fd4985a738c5529f6d5f4f45666534720952f52566e17366&')"
}}
>
<div className="bg-overlay"></div>
</div>

<header className="relative z-50 bg-black/30 backdrop-blur-md border-b border-white/10">

<div className="max-w-7xl mx-auto px-4">

<div className="flex items-center justify-between h-16">

<div className="flex items-center gap-4">

<div className="logo-spin">
<img
src="https://media.discordapp.net/attachments/1501629649942478989/1502620000538595458/a_8c9fa74f76e6fded7ea8d63f23b201e0-1-2.gif?ex=6a005f6d&is=69ff0ded&hm=4ed9db59b7236e8831a9980d71aad2454597bfe05bc77213f4ddbbf023ea2979&=&width=183&height=183"
className="h-12 w-12 rounded-full"
alt="logo"
/>
</div>

<div>
<h1 className="text-xl font-bold gradient-text">Legion RP</h1>
<p className="text-sm text-gray-300">PS4 Server | 1600+ membri</p>
</div>

</div>

<nav className="hidden md:flex items-center gap-2">

{navItems.map(item=>{

const Icon = item.icon;

return(
<button
key={item.id}
onClick={()=>setActiveSection(item.id)}
className={`flex items-center gap-2 px-5 py-3 rounded-lg transition ${
activeSection===item.id
? "bg-white/10 border-r-2 border-red-500 text-white"
: "text-gray-300 hover:bg-white/5"
}`}
>
<Icon className="w-5 h-5"/>
{item.label}
</button>
)

})}

</nav>

<a
href="https://discord.gg/tcKWkJPTer"
target="_blank"
className="hidden md:block bg-gradient-to-r from-red-600 to-red-700 px-5 py-2 rounded-lg font-semibold glow-border"
>
Unisciti
</a>

<button
className="md:hidden text-white"
onClick={()=>setIsMenuOpen(!isMenuOpen)}
>
☰
</button>

</div>

{isMenuOpen && (
<div className="md:hidden pb-4">

{navItems.map(item=>{

const Icon = item.icon;

return(
<button
key={item.id}
onClick={()=>{
setActiveSection(item.id);
setIsMenuOpen(false);
}}
className="flex items-center gap-3 w-full py-3 text-left text-gray-300"
>
<Icon className="w-5 h-5"/>
{item.label}
</button>
)

})}

</div>
)}

</div>

</header>

<main className="relative z-10 p-6">

{activeSection==="home" && (

<div className="max-w-6xl mx-auto">

<div className="text-center mb-16">

<div className="flex justify-center mb-6 animate-pulse-slow">
<img
src="https://media.discordapp.net/attachments/1501629649942478989/1502620000538595458/a_8c9fa74f76e6fded7ea8d63f23b201e0-1-2.gif?ex=6a005f6d&is=69ff0ded&hm=4ed9db59b7236e8831a9980d71aad2454597bfe05bc77213f4ddbbf023ea2979&=&width=183&height=183"
className="h-28 w-28"
/>
</div>

<h2 className="text-5xl md:text-6xl font-bold mb-5">
<span className="gradient-text">Legion RP</span>
</h2>

<p className="text-xl text-gray-300 max-w-3xl mx-auto mb-8">
Il più grande server RolePlay PS4 in Italia con oltre
<span className="text-white font-bold"> 1600+ membri </span>
attivi.
</p>

<div className="grid md:grid-cols-3 gap-6 mb-10">

<StatCard
value="1600+"
label="Membri Attivi"
icon={UsersIcon}
color="text-blue-500"
/>

<StatCard
value="24/7"
label="Server Online"
icon={ShieldIcon}
color="text-green-500"
/>

<StatCard
value="PS4"
label="Piattaforma"
icon={AwardIcon}
color="text-purple-500"
/>

</div>

<a
href="https://discord.gg/tcKWkJPTer"
target="_blank"
className="inline-flex items-center gap-3 bg-gradient-to-r from-red-600 to-red-700 px-8 py-4 rounded-full font-bold text-lg glow-border"
>
Unisciti al Server 🚀
</a>

</div>

<div className="grid md:grid-cols-2 gap-8">

<div className="bg-gradient-to-br from-gray-900 to-gray-800 rounded-2xl p-8 border border-gray-700 card-hover">
<div className="flex items-center gap-3 mb-5">
<AwardIcon className="w-6 h-6 text-red-500"/>
<h3 className="text-2xl font-bold">Chi Siamo</h3>
</div>

<p className="text-gray-300 leading-relaxed">
Legion RP è un server RolePlay dedicato ai giocatori PS4.
Offriamo un'esperienza immersiva con community attiva,
staff professionale ed eventi esclusivi.
</p>
</div>

<div className="bg-gradient-to-br from-gray-900 to-gray-800 rounded-2xl p-8 border border-gray-700 card-hover">

<div className="flex items-center gap-3 mb-5">
<BriefcaseIcon className="w-6 h-6 text-blue-500"/>
<h3 className="text-2xl font-bold">Caratteristiche</h3>
</div>

<ul className="space-y-3 text-gray-300">

<li>✅ Staff attivo 24/7</li>
<li>✅ Eventi settimanali</li>
<li>✅ Community organizzata</li>
<li>✅ Supporto rapido</li>
<li>✅ Esperienza RP realistica</li>

</ul>

</div>

</div>

</div>

)}

{activeSection==="staff" && (

<div className="max-w-6xl mx-auto">

<div className="text-center mb-12">
<h2 className="text-5xl font-bold mb-3">Team Staff</h2>
<p className="text-gray-300">
Conosci lo staff di Legion RP
</p>
</div>

<div className="grid md:grid-cols-2 lg:grid-cols-3 gap-8">

{staffMembers.map(staff=>(

<div
key={staff.id}
className="bg-gradient-to-br from-gray-900 to-gray-800 rounded-2xl p-6 border border-gray-700 card-hover"
>

<div className="flex items-center gap-4 mb-5">

<img
src={staff.avatar}
className="w-16 h-16 rounded-full border-2 border-white/20"
alt={staff.name}
/>

<div>
<h3 className="text-xl font-bold">{staff.name}</h3>
<p className="text-gray-400">{staff.role}</p>
<span className="inline-block mt-1 bg-gray-700 text-xs px-2 py-1 rounded-full">
{staff.rank}
</span>
</div>

</div>

<p className="text-gray-300 mb-4">
{staff.bio}
</p>

<div className="flex flex-wrap gap-2">

{staff.achievements.map((a,i)=>(
<span
key={i}
className="bg-gray-800 text-gray-300 text-xs px-2 py-1 rounded"
>
{a}
</span>
))}

</div>

</div>

))}

</div>

</div>

)}

{activeSection==="partnerships" && (

<div className="max-w-5xl mx-auto">

<div className="text-center mb-12">
<h2 className="text-5xl font-bold mb-3">Partnership</h2>
<p className="text-gray-300">
Le nostre collaborazioni ufficiali
</p>
</div>

<div className="grid md:grid-cols-2 gap-8">

{partnerships.map(partner=>(

<div
key={partner.id}
className="bg-gradient-to-br from-gray-900 to-gray-800 rounded-2xl p-6 border border-gray-700 card-hover"
>

<div className="flex items-start gap-4">

<img
src={partner.logo}
className="w-16 h-16 rounded-xl"
alt={partner.name}
/>

<div className="flex-1">

<div className="flex items-center justify-between">

<h3 className="text-xl font-bold">
{partner.name}
</h3>

<div className="flex items-center gap-1">
<StarIcon className="w-4 h-4 text-yellow-400"/>
<span>{partner.rating}</span>
</div>

</div>

<p className="text-gray-400 mt-2">
{partner.description}
</p>

<a
href={partner.url}
target="_blank"
className="inline-flex items-center gap-2 text-red-400 mt-4 hover:text-red-300"
>
Visita <ArrowRightIcon className="w-4 h-4"/>
</a>

</div>

</div>

</div>

))}

</div>

</div>

)}

{activeSection==="legal" && (

<div className="max-w-4xl mx-auto">

<div className="text-center mb-12">
<h2 className="text-5xl font-bold mb-3">
Informazioni Legali
</h2>
<p className="text-gray-300">
Dettagli e disclaimer del progetto
</p>
</div>

<div className="space-y-8">

<div className="bg-gradient-to-br from-gray-900 to-gray-800 rounded-2xl p-8 border border-gray-700">

<h3 className="text-2xl font-bold mb-4">

</h3>

</p>

<div className="bg-gradient-to-br from-gray-900 to-gray-800 rounded-2xl p-8 border border-gray-700">

<p className="text-gray-300 leading-relaxed">

e della community.
</p>

</div>

</div>

</div>

</main>

<footer className="relative z-10 bg-black/40 backdrop-blur-md border-t border-white/10 mt-20">

<div className="max-w-6xl mx-auto px-6 py-10">

<h3 className="text-xl font-bold gradient-text">
Legion RP

</body>
</html>
